# Local deployment layer for a dsh profile.
#
# Adds the two workspace plugins over the active bundle stack:
#   @local/dsh-browser -> BrowserAutomationService + agent_browser tool
#   @local/dsh-orbit   -> OrbitService + orbit_controller tool + recoverable guards
#
# Apply after the shared bundles. Orbit owns orchestration; the browser plugin
# owns browser capability. The two only meet through the `agent_browser`
# capability contract, never through imports.
#
# Machine-specific values (for example a Chromium executablePath) belong in the
# profile's own cordis.patch.yml, not here.
- insert:
    - id: local-browser
      name: '@local/dsh-browser'

    - id: local-orbit
      name: '@local/dsh-orbit'
      config:
        browserTools:
          - agent_browser
